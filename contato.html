<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato | Pink Runway</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Entre em contato</h1>
        <p>Vamos conversar sobre moda!</p>
    </header>

    <nav>
        <a href="index.html">Início</a>
        <a href="pagina-inicial.html">Sobre</a>
        <a href="galeria.html">Galeria</a>
        <a href="contato.html">Contato</a>
    </nav>

    <main>
        <section class="conteudo">
            <h2>Envie sua mensagem</h2>

            <form action="#" method="get">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome"
                       placeholder="Digite seu nome" required>

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email"
                       placeholder="Digite seu e-mail" required>

                <label for="mensagem">Mensagem:</label>
                <textarea id="mensagem" name="mensagem"
                          rows="5" placeholder="Escreva sua mensagem"
                          required></textarea>

                <button type="submit">Enviar mensagem</button>
            </form>

            <p class="aviso">
                Este formulário é demonstrativo e ainda não envia
                mensagens para um e-mail.
            </p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Pink Runway. Todos os direitos reservados.</p>
    </footer>

</body>
</html>
